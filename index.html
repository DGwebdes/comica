<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Men Reading Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-x">X</div>
            Reading Tracker
        </div>
        <div class="header-progress">
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="global-bar" style="width:0%"></div>
            </div>
            <div class="progress-label" id="global-label">0 / 0 read</div>
        </div>
        <div class="header-actions">
            <button class="btn-ghost" onclick="markAllInView()">Mark all read</button>
            <button class="btn-ghost" onclick="showReset()">Reset</button>
        </div>
    </header>

    <div class="main">
        <div class="era-nav" id="era-nav"></div>

        <div class="legend">
            <div class="legend-item"><span class="badge badge-core">CORE</span> Essential reading</div>
            <div class="legend-item"><span class="badge badge-event">EVENT</span> Major crossover</div>
            <div class="legend-item"><span class="badge badge-tie">TIE</span> Companion title</div>
        </div>

        <div id="eras-container"></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <h3>Reset all progress?</h3>
            <p>This will clear every checked title and cannot be undone.</p>
            <div class="confirm-actions">
                <button class="btn-cancel" onclick="hideReset()">Cancel</button>
                <button class="btn-danger" onclick="resetAll()">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    </script>
</body>

</html>
